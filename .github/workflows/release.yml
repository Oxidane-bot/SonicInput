name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.10"
  UV_VERSION: "0.11.31"
  SONICINPUT_NUITKA_COMPILER: msvc

jobs:
  publish:
    name: Build and Publish Windows Release
    # Nuitka 2.8 supports the VS 2022 toolchain, not the current VS 2026 image.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Select release tag
        id: release
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vX.Y.Z format: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Restore Nuitka compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\nuitka-cache
          key: nuitka-${{ runner.os }}-windows-2022-msvc-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            nuitka-${{ runner.os }}-windows-2022-msvc-py${{ env.PYTHON_VERSION }}-

      - name: Verify tag and project version
        shell: pwsh
        run: |
          $projectVersion = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($projectVersion -ne "${{ steps.release.outputs.version }}") {
            throw "Tag ${{ steps.release.outputs.tag }} does not match pyproject.toml version $projectVersion"
          }

      - name: Build and smoke-test release
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}\nuitka-cache
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere was not found: $vswhere"
          }

          $vsPath = (& $vswhere -latest -products * -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            throw "Visual Studio 2022 C++ x64 tools were not found"
          }
          $vcvars = Join-Path $vsPath.Trim() "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) {
            throw "VS 2022 environment script was not found: $vcvars"
          }

          $compilerEnvironment = & cmd.exe /d /s /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not initialize the VS 2022 x64 environment"
          }
          foreach ($line in $compilerEnvironment) {
            if ($line -match "^([^=]+)=(.*)$") {
              Set-Item -Path "Env:$($Matches[1])" -Value $Matches[2]
            }
          }

          $cl = Get-Command cl.exe -ErrorAction Stop
          Write-Output "[PRECHECK] MSVC compiler: $($cl.Source)"

          $probeSource = Join-Path $env:RUNNER_TEMP "nuitka-msvc-probe.py"
          $probeOutput = Join-Path $env:RUNNER_TEMP "nuitka-msvc-probe"
          Set-Content -LiteralPath $probeSource -Value "print('nuitka-msvc-preflight')" -Encoding ascii
          uv run --locked --extra local --extra dev --group dev python -m nuitka --standalone --assume-yes-for-downloads --msvc=14.3 --output-dir=$probeOutput $probeSource
          if ($LASTEXITCODE -ne 0) {
            throw "Nuitka MSVC preflight failed"
          }
          $probeExecutable = Join-Path (Join-Path $probeOutput "nuitka-msvc-probe.dist") "nuitka-msvc-probe.exe"
          if (-not (Test-Path -LiteralPath $probeExecutable -PathType Leaf)) {
            throw "Nuitka MSVC preflight executable was not created: $probeExecutable"
          }
          & $probeExecutable
          if ($LASTEXITCODE -ne 0) {
            throw "Nuitka MSVC preflight executable failed"
          }

          .\scripts\release.ps1 -NoOffline

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseDir = "dist\release\v${{ steps.release.outputs.version }}"
          $assets = Get-ChildItem -LiteralPath $releaseDir -File | ForEach-Object FullName
          if ($assets.Count -lt 2) {
            throw "Expected executable and SHA-256 sidecar in $releaseDir"
          }
          gh release create "${{ steps.release.outputs.tag }}" @assets --title "SonicInput ${{ steps.release.outputs.tag }}" --notes-file RELEASE_NOTES.md
