[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonicinput"
version = "0.8.1"
description = "Lightweight voice input tool powered by sherpa-onnx and cloud ASR"
requires-python = ">=3.10"

# 核心依赖 - 所有模式都需要
dependencies = [
    # Windows GUI 依赖（使用平台标记，只在 Windows 上安装）
    "PyAudio>=0.2.11; sys_platform == 'win32'",
    "PySide6>=6.6.0; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "pyperclip>=1.8.4; sys_platform == 'win32'",
    "pynput>=1.7.6; sys_platform == 'win32'",
    "sounddevice>=0.4.6; sys_platform == 'win32'",
    "qt-material>=2.17; sys_platform == 'win32'",
    # 通用依赖（跨平台）
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "samplerate>=0.2.3",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "psutil>=5.9.0",
    "cryptography>=46.0.3",
    # 云转录支持
    "groq>=0.9.0",
    "wtpsplit-lite==0.2.0",
    "onnxruntime==1.23.2",
    "socksio==1.0.0",
    "pypinyin>=0.55.0",
]

[project.optional-dependencies]
# Windows GUI依赖（已包含在核心依赖中，保留此extras为向后兼容）
windows = []

# 本地转录支持（轻量级 sherpa-onnx）
local = [
    "sherpa-onnx>=1.10.0",
]

# 开发工具
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.4.0",
    "pytest-html>=4.1.0",
    "pytest-qt>=4.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "vulture>=2.14",
    "bandit>=1.8.6",
]

# 完整安装（Windows+本地+开发）
full = [
    "sonicinput[windows,local,dev]"
]

# CI测试依赖（跨平台）
ci = [
    "sonicinput[dev]"
]

[project.scripts]
sonicinput = "sonicinput.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU/CUDA support",
    "gui: marks tests that require GUI/Qt environment (use '-m \"not gui\"' to skip)",
    "e2e: marks end-to-end workflow tests",
]
addopts = "-v"

# mypy config: strict on what we've already cleaned, baselined for the rest.
# Adding a new error in any module NOT listed below will fail CI (no `|| true`).
# To remove a module from the baseline, fix its errors and delete its override.
[tool.mypy]
ignore_missing_imports = true
no_implicit_optional = true
# SonicInput is a Windows desktop application. Keep mypy's target platform
# consistent across local development and the Ubuntu lint runner.
platform = "win32"
# type-abstract disabled: the DI container legitimately resolves abstract
# interfaces (container.resolve(IFoo)); mypy forbids Type[T] with abstract
# classes (python/mypy#4717), which would force ignores at every call site.
disable_error_code = ["type-abstract"]

[[tool.mypy.overrides]]
module = [
    "sonicinput.ui.apply_transaction",
    "sonicinput.ui.history_formatters",
    "sonicinput.ui.history_workers",
    "sonicinput.ui.components.system_tray.tray_controller",
    "sonicinput.ui.components.system_tray.tray_widget",
]
ignore_errors = true

[dependency-groups]
dev = [
    "fonttools>=4.55.0",
    "nuitka>=2.8.4",
    "types-requests>=2.31",
]
